<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>九九マスター / Kuku Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #hiddenVideo {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .overlay p {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
            padding: 0 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            margin: 0.5rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            z-index: 500;
            pointer-events: none;
            animation: feedbackPop 0.8s ease-out forwards;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .ranking {
            background: rgba(0, 0, 0, 0.9);
            padding: 2rem;
            border-radius: 20px;
            max-width: 90%;
            max-height: 70vh;
            overflow-y: auto;
        }

        .ranking-entry {
            display: flex;
            justify-content: space-between;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .ranking-entry.rank-1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
        }

        .ranking-entry.current {
            border: 2px solid #667eea;
        }
    </style>
</head>
<body>
    <video id="hiddenVideo" playsinline autoplay muted></video>
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
        <h1>🎯 九九マスター</h1>
        <p>人差し指で照準を動かし、<br>親指と人差し指をくっつけてシュート！<br><br>
        Point with index finger to aim,<br>pinch thumb to shoot!</p>
        <button class="btn" onclick="startGameFromButton()">🚀 スタート / Start</button>
        <p style="font-size: 0.8rem; margin-top: 1rem; color: #666;">
            ※ カメラ使用を許可してください
        </p>
    </div>

    <!-- Loading -->
    <div id="loadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
        <h1>Loading...</h1>
        <p id="loadingText">Initializing...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Error -->
    <div id="errorOverlay" class="overlay hidden">
        <h1>⚠️ Error</h1>
        <p id="errorMessage">Something went wrong</p>
        <button class="btn" onclick="location.reload()">🔄 Retry</button>
    </div>

    <!-- Ranking -->
    <div id="rankingOverlay" class="overlay hidden">
        <h1>🏆 Results!</h1>
        <div class="ranking" id="rankingDisplay"></div>
        <div class="btn-group">
            <button class="btn" onclick="nextRound()">▶️ Next</button>
            <button class="btn" onclick="location.reload()">🏠 Menu</button>
        </div>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

    <script>
        'use strict';

        // ============================================
        // GAME STATE
        // ============================================
        const STATE = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,

            // MediaPipe
            hands: null,
            video: null,
            handData: null,

            // Cursor position (smoothed)
            cursorX: 0,
            cursorY: 0,
            targetX: 0,
            targetY: 0,
            cursorVisible: false,

            // Shooting
            isPinching: false,
            wasPinching: false,
            canShoot: true,
            shootCooldown: 0,

            // Game
            score: 0,
            streak: 0,
            bestStreak: 0,
            questionIndex: 0,
            timeLeft: 60,
            level: 1,
            currentQuestion: null,

            // Targets (balloons)
            targets: [],

            // Particles
            particles: [],

            // Flags
            isRunning: false,
            modelReady: false,
            gameStartTime: 0,

            // Audio
            audioCtx: null
        };

        // ============================================
        // INITIALIZATION
        // ============================================
        function initCanvas() {
            STATE.canvas = document.getElementById('gameCanvas');
            STATE.ctx = STATE.canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            STATE.width = window.innerWidth;
            STATE.height = window.innerHeight;
            STATE.canvas.width = STATE.width;
            STATE.canvas.height = STATE.height;
        }

        async function initMediaPipe() {
            updateLoading(10, 'Requesting camera...');

            STATE.video = document.getElementById('hiddenVideo');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 320, height: 240 }
                });
                STATE.video.srcObject = stream;
                await STATE.video.play();
            } catch (e) {
                throw new Error('カメラアクセスが拒否されました');
            }

            updateLoading(40, 'Loading hand model...');

            STATE.hands = new Hands({
                locateFile: (file) => `https://unpkg.com/@mediapipe/hands@0.4.1646424915/${file}`
            });

            STATE.hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            STATE.hands.onResults(onHandResults);

            updateLoading(100, 'Ready!');
            STATE.modelReady = true;
        }

        function updateLoading(percent, text) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('loadingText').textContent = text;
        }

        // ============================================
        // HAND TRACKING
        // ============================================
        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                STATE.handData = results.multiHandLandmarks[0];
                STATE.cursorVisible = true;
            } else {
                STATE.handData = null;
                STATE.cursorVisible = false;
            }
        }

        function updateCursor() {
            if (!STATE.handData) {
                STATE.cursorVisible = false;
                return;
            }

            const indexTip = STATE.handData[8];  // Index finger tip
            const thumbTip = STATE.handData[4];  // Thumb tip

            // Direct mapping: finger position → screen position
            // Mirror X for natural movement
            STATE.targetX = (1 - indexTip.x) * STATE.width;
            STATE.targetY = indexTip.y * STATE.height;

            // Smooth cursor movement (70% toward target = responsive but smooth)
            const smoothing = 0.7;
            STATE.cursorX += (STATE.targetX - STATE.cursorX) * smoothing;
            STATE.cursorY += (STATE.targetY - STATE.cursorY) * smoothing;

            // Pinch detection: thumb tip close to index tip
            const dx = thumbTip.x - indexTip.x;
            const dy = thumbTip.y - indexTip.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            STATE.wasPinching = STATE.isPinching;
            STATE.isPinching = distance < 0.06; // Pinch threshold

            // Shoot on pinch START (not while holding)
            if (STATE.isPinching && !STATE.wasPinching && STATE.canShoot) {
                shoot();
                STATE.canShoot = false;
                STATE.shootCooldown = 20; // frames
            }

            // Cooldown
            if (STATE.shootCooldown > 0) {
                STATE.shootCooldown--;
                if (STATE.shootCooldown === 0) {
                    STATE.canShoot = true;
                }
            }
        }

        // ============================================
        // SHOOTING
        // ============================================
        function shoot() {
            playSound('shoot');

            // Create muzzle flash
            STATE.particles.push({
                x: STATE.cursorX,
                y: STATE.cursorY,
                vx: 0,
                vy: 0,
                life: 10,
                maxLife: 10,
                size: 30,
                color: '#ffff00'
            });

            // Check hit
            let hit = false;
            for (let i = STATE.targets.length - 1; i >= 0; i--) {
                const t = STATE.targets[i];
                const dx = STATE.cursorX - t.x;
                const dy = STATE.cursorY - t.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < t.radius + 20) { // Hit!
                    hit = true;
                    handleHit(t, i);
                    break;
                }
            }

            if (!hit) {
                showFeedback('MISS', '#888');
                playSound('miss');
            }
        }

        function handleHit(target, index) {
            // Explosion
            createExplosion(target.x, target.y, target.isAnswer ? '#4CAF50' : '#ff4444');

            STATE.targets.splice(index, 1);

            if (target.isAnswer) {
                STATE.score += 100;
                STATE.streak++;
                STATE.bestStreak = Math.max(STATE.bestStreak, STATE.streak);

                if (STATE.streak >= 3) {
                    showFeedback(`${STATE.streak} COMBO! 🔥`, '#FF6B00');
                } else {
                    showFeedback('CORRECT! +100', '#4CAF50');
                }
                playSound('correct');
                nextQuestion();
            } else {
                STATE.score = Math.max(0, STATE.score - 20);
                STATE.streak = Math.max(0, STATE.streak - 1);
                showFeedback('WRONG -20', '#ff4444');
                playSound('wrong');
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const speed = 3 + Math.random() * 4;
                STATE.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 30,
                    maxLife: 30,
                    size: 8 + Math.random() * 8,
                    color: color
                });
            }
        }

        // ============================================
        // QUESTIONS & TARGETS
        // ============================================
        function generateQuestion() {
            const a = 1 + Math.floor(Math.random() * 9);
            const b = 1 + Math.floor(Math.random() * 9);
            const answer = a * b;

            // Generate wrong answers
            const wrongAnswers = new Set();
            while (wrongAnswers.size < 4) {
                const wrong = answer + Math.floor(Math.random() * 11) - 5;
                if (wrong > 0 && wrong !== answer) {
                    wrongAnswers.add(wrong);
                }
            }

            return {
                text: `${a} × ${b} = ?`,
                answer: answer,
                allNumbers: [answer, ...Array.from(wrongAnswers)]
            };
        }

        function spawnTargets() {
            STATE.targets = [];

            if (!STATE.currentQuestion) return;

            const numbers = STATE.currentQuestion.allNumbers;
            const answer = STATE.currentQuestion.answer;

            // Shuffle
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            // Create balloons
            const margin = 80;
            const usableWidth = STATE.width - margin * 2;
            const usableHeight = STATE.height - 250;

            numbers.forEach((num, i) => {
                const cols = Math.min(numbers.length, 3);
                const rows = Math.ceil(numbers.length / cols);
                const col = i % cols;
                const row = Math.floor(i / cols);

                const cellW = usableWidth / cols;
                const cellH = usableHeight / rows;

                STATE.targets.push({
                    x: margin + cellW * (col + 0.5) + (Math.random() - 0.5) * 40,
                    y: 180 + cellH * (row + 0.5) + (Math.random() - 0.5) * 30,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: -0.3 - Math.random() * 0.3, // Float up
                    radius: 45,
                    number: num,
                    isAnswer: num === answer,
                    hue: num === answer ? 120 : Math.random() * 360, // Green for answer
                    phase: Math.random() * Math.PI * 2
                });
            });
        }

        function updateTargets() {
            const time = Date.now() * 0.002;

            STATE.targets.forEach(t => {
                // Float upward with slight wobble
                t.x += t.vx + Math.sin(time + t.phase) * 0.3;
                t.y += t.vy;

                // Bounce off edges
                if (t.x < t.radius || t.x > STATE.width - t.radius) t.vx *= -1;

                // Wrap vertically
                if (t.y < -t.radius) t.y = STATE.height + t.radius;
                if (t.y > STATE.height + t.radius) t.y = -t.radius;

                // Keep in bounds
                t.x = Math.max(t.radius, Math.min(STATE.width - t.radius, t.x));
            });
        }

        function updateParticles() {
            for (let i = STATE.particles.length - 1; i >= 0; i--) {
                const p = STATE.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life--;

                if (p.life <= 0) {
                    STATE.particles.splice(i, 1);
                }
            }
        }

        // ============================================
        // RENDERING (2D)
        // ============================================
        function render() {
            const ctx = STATE.ctx;

            // Clear with gradient background
            const grad = ctx.createLinearGradient(0, 0, 0, STATE.height);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#16213e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, STATE.width, STATE.height);

            // Draw HUD
            drawHUD(ctx);

            // Draw targets (balloons)
            STATE.targets.forEach(t => {
                drawBalloon(ctx, t);
            });

            // Draw particles
            STATE.particles.forEach(p => {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw cursor/crosshair
            if (STATE.cursorVisible) {
                drawCrosshair(ctx, STATE.cursorX, STATE.cursorY);
            }
        }

        function drawHUD(ctx) {
            // Question box
            ctx.fillStyle = 'rgba(102, 126, 234, 0.9)';
            roundRect(ctx, STATE.width / 2 - 150, 20, 300, 60, 15);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(STATE.currentQuestion ? STATE.currentQuestion.text : '?', STATE.width / 2, 50);

            // Stats bar
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            roundRect(ctx, 10, 90, STATE.width - 20, 40, 10);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`🎯 Lv.${STATE.level}`, 20, 110);
            ctx.fillText(`📊 ${STATE.questionIndex}/10`, 100, 110);
            ctx.fillText(`⏱️ ${Math.ceil(STATE.timeLeft)}s`, 200, 110);
            ctx.fillText(`💰 ${STATE.score}`, 290, 110);
            ctx.fillText(`🔥 ${STATE.streak}`, 380, 110);

            // Pinch indicator
            if (STATE.isPinching) {
                ctx.fillStyle = 'rgba(255, 100, 100, 0.3)';
                ctx.beginPath();
                ctx.arc(STATE.cursorX, STATE.cursorY, 60, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawBalloon(ctx, t) {
            const time = Date.now() * 0.003;
            const pulse = 1 + Math.sin(time + t.phase) * 0.05;

            // Balloon body
            ctx.fillStyle = t.isAnswer ?
                `hsl(120, 70%, 50%)` :
                `hsl(${t.hue}, 60%, 55%)`;

            ctx.beginPath();
            ctx.ellipse(t.x, t.y, t.radius * pulse, t.radius * 1.2 * pulse, 0, 0, Math.PI * 2);
            ctx.fill();

            // Balloon highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.ellipse(t.x - t.radius * 0.3, t.y - t.radius * 0.4, t.radius * 0.2, t.radius * 0.3, -0.5, 0, Math.PI * 2);
            ctx.fill();

            // Balloon string
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(t.x, t.y + t.radius * 1.2);
            ctx.quadraticCurveTo(t.x + 10, t.y + t.radius * 1.5, t.x, t.y + t.radius * 1.8);
            ctx.stroke();

            // Number
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${t.radius * 0.8}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 4;
            ctx.fillText(t.number.toString(), t.x, t.y);
            ctx.shadowBlur = 0;
        }

        function drawCrosshair(ctx, x, y) {
            const size = 35;
            const thickness = 4;

            // Outer glow
            ctx.strokeStyle = 'rgba(255, 50, 50, 0.5)';
            ctx.lineWidth = thickness + 4;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.stroke();

            // Main circle
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = thickness;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.stroke();

            // Crosshair lines
            ctx.beginPath();
            ctx.moveTo(x - size - 10, y);
            ctx.lineTo(x - size + 15, y);
            ctx.moveTo(x + size - 15, y);
            ctx.lineTo(x + size + 10, y);
            ctx.moveTo(x, y - size - 10);
            ctx.lineTo(x, y - size + 15);
            ctx.moveTo(x, y + size - 15);
            ctx.lineTo(x, y + size + 10);
            ctx.stroke();

            // Center dot
            ctx.fillStyle = '#ff3333';
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ============================================
        // GAME FLOW
        // ============================================
        function nextQuestion() {
            STATE.questionIndex++;

            if (STATE.questionIndex >= 10) {
                endRound();
                return;
            }

            STATE.currentQuestion = generateQuestion();
            spawnTargets();
        }

        function endRound() {
            STATE.isRunning = false;
            showRanking();
        }

        function showRanking() {
            const display = document.getElementById('rankingDisplay');
            display.innerHTML = `
                <div class="ranking-entry rank-1 current">
                    <span>🎉 Your Score</span>
                    <span>${STATE.score} pts | 🔥 ${STATE.bestStreak}</span>
                </div>
            `;
            document.getElementById('rankingOverlay').classList.remove('hidden');
        }

        function nextRound() {
            document.getElementById('rankingOverlay').classList.add('hidden');
            STATE.level++;
            startGame();
        }

        // ============================================
        // AUDIO
        // ============================================
        function initAudio() {
            try {
                STATE.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn('Audio not supported');
            }
        }

        function playSound(type) {
            if (!STATE.audioCtx) return;

            try {
                const osc = STATE.audioCtx.createOscillator();
                const gain = STATE.audioCtx.createGain();
                osc.connect(gain);
                gain.connect(STATE.audioCtx.destination);

                const now = STATE.audioCtx.currentTime;

                switch (type) {
                    case 'shoot':
                        osc.frequency.value = 200;
                        osc.type = 'square';
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'correct':
                        osc.frequency.value = 523;
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'wrong':
                        osc.frequency.value = 180;
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    case 'miss':
                        osc.frequency.value = 100;
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                }
            } catch (e) {}
        }

        // ============================================
        // FEEDBACK
        // ============================================
        function showFeedback(text, color) {
            const existing = document.querySelector('.feedback');
            if (existing) existing.remove();

            const el = document.createElement('div');
            el.className = 'feedback';
            el.textContent = text;
            el.style.color = color;
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 800);
        }

        // ============================================
        // MAIN LOOP
        // ============================================
        async function gameLoop() {
            if (!STATE.isRunning) return;

            // Update time
            const elapsed = (performance.now() - STATE.gameStartTime) / 1000;
            STATE.timeLeft = Math.max(0, 60 - elapsed);

            if (STATE.timeLeft <= 0) {
                endRound();
                return;
            }

            // Update game objects
            updateCursor();
            updateTargets();
            updateParticles();

            // Render
            render();

            requestAnimationFrame(gameLoop);
        }

        async function detectionLoop() {
            if (!STATE.isRunning || !STATE.modelReady) return;

            try {
                await STATE.hands.send({ image: STATE.video });
            } catch (e) {
                console.error('Detection error:', e);
            }

            if (STATE.isRunning) {
                setTimeout(detectionLoop, 33); // ~30 FPS
            }
        }

        // ============================================
        // START GAME
        // ============================================
        async function startGame() {
            // Reset state
            STATE.score = 0;
            STATE.streak = 0;
            STATE.bestStreak = 0;
            STATE.questionIndex = 0;
            STATE.timeLeft = 60;
            STATE.targets = [];
            STATE.particles = [];
            STATE.cursorX = STATE.width / 2;
            STATE.cursorY = STATE.height / 2;

            // Generate first question
            STATE.currentQuestion = generateQuestion();
            spawnTargets();

            // Start game
            STATE.isRunning = true;
            STATE.gameStartTime = performance.now();

            // Start loops
            requestAnimationFrame(gameLoop);
            detectionLoop();
        }

        async function startGameFromButton() {
            try {
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('loadingOverlay').classList.remove('hidden');

                initCanvas();
                initAudio();
                await initMediaPipe();

                document.getElementById('loadingOverlay').classList.add('hidden');

                await startGame();

            } catch (e) {
                console.error('Start error:', e);
                document.getElementById('errorMessage').textContent = e.message;
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('errorOverlay').classList.remove('hidden');
            }
        }

        // Prevent scroll
        document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
