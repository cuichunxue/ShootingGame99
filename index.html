<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>九九マスター / Kuku Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #hiddenVideo {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .overlay p {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
            padding: 0 1rem;
        }

        .btn {
            padding: 1.2rem 2.5rem;
            margin: 0.5rem;
            font-size: 1.3rem;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            z-index: 500;
            pointer-events: none;
            animation: feedbackPop 0.8s ease-out forwards;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .ranking {
            background: rgba(0, 0, 0, 0.9);
            padding: 2rem;
            border-radius: 20px;
            max-width: 90%;
            max-height: 70vh;
            overflow-y: auto;
        }

        .ranking-entry {
            display: flex;
            justify-content: space-between;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .ranking-entry.rank-1 {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Shoot button for touch */
        #shootBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            border: 4px solid #fff;
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            z-index: 200;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #shootBtn:active {
            transform: scale(0.9);
            background: linear-gradient(135deg, #cc0000, #990000);
        }

        #shootBtn.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <video id="hiddenVideo" playsinline autoplay muted></video>
    <canvas id="gameCanvas"></canvas>

    <!-- Shoot Button -->
    <button id="shootBtn" class="hidden">🎯</button>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
        <h1>🎯 九九マスター</h1>
        <p>
            <strong>操作方法:</strong><br>
            👆 人差し指で照準を移動<br>
            🔴 右下のボタンをタップでシュート<br>
            (または親指と人差し指をピンチ)
        </p>
        <button class="btn" onclick="startGameFromButton()">🚀 スタート</button>
    </div>

    <!-- Loading -->
    <div id="loadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
        <h1>Loading...</h1>
        <p id="loadingText">Initializing...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Error -->
    <div id="errorOverlay" class="overlay hidden">
        <h1>⚠️ Error</h1>
        <p id="errorMessage">Something went wrong</p>
        <button class="btn" onclick="location.reload()">🔄 Retry</button>
    </div>

    <!-- Ranking -->
    <div id="rankingOverlay" class="overlay hidden">
        <h1>🏆 Results!</h1>
        <div class="ranking" id="rankingDisplay"></div>
        <div class="btn-group">
            <button class="btn" onclick="nextRound()">▶️ Next</button>
            <button class="btn" onclick="location.reload()">🏠 Menu</button>
        </div>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

    <script>
        'use strict';

        // ============================================
        // GAME STATE
        // ============================================
        const STATE = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,

            // MediaPipe
            hands: null,
            video: null,
            handData: null,

            // Cursor - using smoothed position
            cursorX: 0,
            cursorY: 0,
            rawX: 0,
            rawY: 0,
            cursorVisible: false,

            // Shooting
            isPinching: false,
            wasPinching: false,
            canShoot: true,
            lastShootTime: 0,

            // Game
            score: 0,
            streak: 0,
            bestStreak: 0,
            questionIndex: 0,
            timeLeft: 60,
            level: 1,
            currentQuestion: null,

            // Targets
            targets: [],

            // Particles
            particles: [],

            // Flags
            isRunning: false,
            modelReady: false,
            gameStartTime: 0,

            // Audio
            audioCtx: null
        };

        // ============================================
        // CONFIG
        // ============================================
        const CONFIG = {
            PINCH_THRESHOLD: 0.08,      // Larger = easier to pinch
            SHOOT_COOLDOWN: 350,        // ms between shots
            CURSOR_SMOOTHING: 0.5,      // 0-1, higher = more responsive
            TARGET_HIT_RADIUS: 30       // Extra hit margin
        };

        // ============================================
        // INITIALIZATION
        // ============================================
        function initCanvas() {
            STATE.canvas = document.getElementById('gameCanvas');
            STATE.ctx = STATE.canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            STATE.width = window.innerWidth;
            STATE.height = window.innerHeight;
            STATE.canvas.width = STATE.width;
            STATE.canvas.height = STATE.height;
            STATE.cursorX = STATE.width / 2;
            STATE.cursorY = STATE.height / 2;
        }

        async function initMediaPipe() {
            updateLoading(10, 'Requesting camera...');

            STATE.video = document.getElementById('hiddenVideo');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 }
                });
                STATE.video.srcObject = stream;
                await STATE.video.play();
            } catch (e) {
                throw new Error('カメラアクセスが拒否されました');
            }

            updateLoading(40, 'Loading hand model...');

            STATE.hands = new Hands({
                locateFile: (file) => `https://unpkg.com/@mediapipe/hands@0.4.1646424915/${file}`
            });

            STATE.hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            STATE.hands.onResults(onHandResults);

            updateLoading(100, 'Ready!');
            STATE.modelReady = true;
        }

        function updateLoading(percent, text) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('loadingText').textContent = text;
        }

        // ============================================
        // HAND TRACKING
        // ============================================
        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                STATE.handData = results.multiHandLandmarks[0];
                STATE.cursorVisible = true;
            } else {
                STATE.handData = null;
                STATE.cursorVisible = false;
            }
        }

        function updateCursor() {
            if (!STATE.handData) {
                STATE.cursorVisible = false;
                return;
            }

            const indexTip = STATE.handData[8];   // Index finger tip
            const thumbTip = STATE.handData[4];   // Thumb tip

            // Raw position (mirrored X for natural movement)
            STATE.rawX = (1 - indexTip.x) * STATE.width;
            STATE.rawY = indexTip.y * STATE.height;

            // Smooth cursor movement
            STATE.cursorX += (STATE.rawX - STATE.cursorX) * CONFIG.CURSOR_SMOOTHING;
            STATE.cursorY += (STATE.rawY - STATE.cursorY) * CONFIG.CURSOR_SMOOTHING;

            // Pinch detection (thumb close to index)
            const dx = thumbTip.x - indexTip.x;
            const dy = thumbTip.y - indexTip.y;
            const dz = (thumbTip.z || 0) - (indexTip.z || 0);
            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

            STATE.wasPinching = STATE.isPinching;
            STATE.isPinching = distance < CONFIG.PINCH_THRESHOLD;

            // Shoot on pinch START
            if (STATE.isPinching && !STATE.wasPinching) {
                tryShoot();
            }
        }

        // ============================================
        // SHOOTING
        // ============================================
        function tryShoot() {
            const now = Date.now();
            if (now - STATE.lastShootTime < CONFIG.SHOOT_COOLDOWN) return;
            if (!STATE.isRunning) return;

            STATE.lastShootTime = now;
            shoot();
        }

        function shoot() {
            playSound('shoot');

            // Muzzle flash
            STATE.particles.push({
                x: STATE.cursorX,
                y: STATE.cursorY,
                vx: 0,
                vy: 0,
                life: 8,
                maxLife: 8,
                size: 40,
                color: '#ffff00',
                type: 'flash'
            });

            // Check hit
            let hit = false;
            for (let i = STATE.targets.length - 1; i >= 0; i--) {
                const t = STATE.targets[i];
                const dx = STATE.cursorX - t.x;
                const dy = STATE.cursorY - t.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < t.radius + CONFIG.TARGET_HIT_RADIUS) {
                    hit = true;
                    handleHit(t, i);
                    break;
                }
            }

            if (!hit) {
                showFeedback('MISS', '#888');
                playSound('miss');
            }
        }

        function handleHit(target, index) {
            createExplosion(target.x, target.y, target.isAnswer ? '#4CAF50' : '#ff4444');
            STATE.targets.splice(index, 1);

            if (target.isAnswer) {
                STATE.score += 100;
                STATE.streak++;
                STATE.bestStreak = Math.max(STATE.bestStreak, STATE.streak);

                if (STATE.streak >= 3) {
                    showFeedback(`${STATE.streak} COMBO! 🔥`, '#FF6B00');
                } else {
                    showFeedback('CORRECT! ✓', '#4CAF50');
                }
                playSound('correct');
                nextQuestion();
            } else {
                STATE.score = Math.max(0, STATE.score - 20);
                STATE.streak = 0;
                showFeedback('WRONG ✗', '#ff4444');
                playSound('wrong');
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = (i / 15) * Math.PI * 2;
                const speed = 4 + Math.random() * 5;
                STATE.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 25,
                    maxLife: 25,
                    size: 6 + Math.random() * 10,
                    color: color,
                    type: 'particle'
                });
            }
        }

        // ============================================
        // QUESTIONS & TARGETS
        // ============================================
        function generateQuestion() {
            const a = 1 + Math.floor(Math.random() * 9);
            const b = 1 + Math.floor(Math.random() * 9);
            const answer = a * b;

            const wrongAnswers = new Set();
            while (wrongAnswers.size < 4) {
                const wrong = answer + Math.floor(Math.random() * 21) - 10;
                if (wrong > 0 && wrong !== answer && wrong <= 100) {
                    wrongAnswers.add(wrong);
                }
            }

            return {
                text: `${a} × ${b} = ?`,
                answer: answer,
                allNumbers: [answer, ...Array.from(wrongAnswers)]
            };
        }

        function spawnTargets() {
            STATE.targets = [];
            if (!STATE.currentQuestion) return;

            const numbers = [...STATE.currentQuestion.allNumbers];
            const answer = STATE.currentQuestion.answer;

            // Shuffle
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            // Create balloons in grid
            const margin = 60;
            const topMargin = 160;
            const usableWidth = STATE.width - margin * 2;
            const usableHeight = STATE.height - topMargin - 150;

            const cols = Math.min(numbers.length, 3);
            const rows = Math.ceil(numbers.length / cols);

            numbers.forEach((num, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);

                const cellW = usableWidth / cols;
                const cellH = usableHeight / rows;

                STATE.targets.push({
                    x: margin + cellW * (col + 0.5),
                    y: topMargin + cellH * (row + 0.5),
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: -0.2 - Math.random() * 0.2,
                    radius: 50,
                    number: num,
                    isAnswer: num === answer,
                    hue: num === answer ? 120 : 200 + Math.random() * 100,
                    phase: Math.random() * Math.PI * 2
                });
            });
        }

        function updateTargets() {
            const time = Date.now() * 0.001;

            STATE.targets.forEach(t => {
                // Gentle floating motion
                t.x += t.vx + Math.sin(time * 2 + t.phase) * 0.5;
                t.y += t.vy + Math.cos(time * 1.5 + t.phase) * 0.3;

                // Bounce off edges
                if (t.x < t.radius + 20 || t.x > STATE.width - t.radius - 20) {
                    t.vx *= -1;
                    t.x = Math.max(t.radius + 20, Math.min(STATE.width - t.radius - 20, t.x));
                }

                // Wrap vertically
                if (t.y < -t.radius) t.y = STATE.height + t.radius;
                if (t.y > STATE.height + t.radius) t.y = -t.radius;
            });
        }

        function updateParticles() {
            for (let i = STATE.particles.length - 1; i >= 0; i--) {
                const p = STATE.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.type === 'particle') {
                    p.vy += 0.3; // Gravity
                }
                p.life--;

                if (p.life <= 0) {
                    STATE.particles.splice(i, 1);
                }
            }
        }

        // ============================================
        // RENDERING
        // ============================================
        function render() {
            const ctx = STATE.ctx;

            // Background
            const grad = ctx.createLinearGradient(0, 0, 0, STATE.height);
            grad.addColorStop(0, '#0f0f23');
            grad.addColorStop(1, '#1a1a3e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, STATE.width, STATE.height);

            // Stars background
            drawStars(ctx);

            // HUD
            drawHUD(ctx);

            // Targets
            STATE.targets.forEach(t => drawBalloon(ctx, t));

            // Particles
            STATE.particles.forEach(p => {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.type === 'flash' ? 1 : alpha), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Cursor
            if (STATE.cursorVisible) {
                drawCrosshair(ctx, STATE.cursorX, STATE.cursorY);
            }
        }

        function drawStars(ctx) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            const seed = 12345;
            for (let i = 0; i < 50; i++) {
                const x = ((seed * (i + 1) * 7) % STATE.width);
                const y = ((seed * (i + 1) * 13) % STATE.height);
                const size = ((seed * (i + 1)) % 3) + 1;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawHUD(ctx) {
            // Question box
            const qWidth = Math.min(350, STATE.width - 40);
            ctx.fillStyle = 'rgba(102, 126, 234, 0.95)';
            roundRect(ctx, (STATE.width - qWidth) / 2, 20, qWidth, 70, 15);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(STATE.currentQuestion ? STATE.currentQuestion.text : '?', STATE.width / 2, 55);

            // Stats bar
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            roundRect(ctx, 10, 100, STATE.width - 20, 45, 10);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'left';

            const stats = [
                `🎯 Lv.${STATE.level}`,
                `📊 ${STATE.questionIndex}/10`,
                `⏱️ ${Math.ceil(STATE.timeLeft)}s`,
                `💰 ${STATE.score}`,
                `🔥 ${STATE.streak}`
            ];

            const statWidth = (STATE.width - 40) / stats.length;
            stats.forEach((s, i) => {
                ctx.fillText(s, 20 + i * statWidth, 125);
            });
        }

        function drawBalloon(ctx, t) {
            const time = Date.now() * 0.002;
            const pulse = 1 + Math.sin(time + t.phase) * 0.03;
            const r = t.radius * pulse;

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(t.x + 5, t.y + 8, r * 0.9, r * 1.1, 0, 0, Math.PI * 2);
            ctx.fill();

            // Balloon body
            const gradient = ctx.createRadialGradient(t.x - r * 0.3, t.y - r * 0.3, 0, t.x, t.y, r * 1.3);
            if (t.isAnswer) {
                gradient.addColorStop(0, '#7CFC00');
                gradient.addColorStop(1, '#228B22');
            } else {
                gradient.addColorStop(0, `hsl(${t.hue}, 70%, 65%)`);
                gradient.addColorStop(1, `hsl(${t.hue}, 60%, 40%)`);
            }
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.ellipse(t.x, t.y, r, r * 1.2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.ellipse(t.x - r * 0.35, t.y - r * 0.4, r * 0.25, r * 0.35, -0.5, 0, Math.PI * 2);
            ctx.fill();

            // String
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(t.x, t.y + r * 1.2);
            ctx.quadraticCurveTo(t.x + 8, t.y + r * 1.6, t.x - 3, t.y + r * 2);
            ctx.stroke();

            // Number
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${r * 0.7}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 4;
            ctx.fillText(t.number.toString(), t.x, t.y);
            ctx.shadowBlur = 0;
        }

        function drawCrosshair(ctx, x, y) {
            const size = 40;
            const thick = 4;

            // Outer glow
            ctx.strokeStyle = 'rgba(255, 100, 100, 0.4)';
            ctx.lineWidth = thick + 6;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.stroke();

            // Main circle
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = thick;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.stroke();

            // Cross lines
            const gap = 8;
            ctx.beginPath();
            ctx.moveTo(x - size - 12, y);
            ctx.lineTo(x - gap, y);
            ctx.moveTo(x + gap, y);
            ctx.lineTo(x + size + 12, y);
            ctx.moveTo(x, y - size - 12);
            ctx.lineTo(x, y - gap);
            ctx.moveTo(x, y + gap);
            ctx.lineTo(x, y + size + 12);
            ctx.stroke();

            // Center dot
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();

            // Pinch indicator
            if (STATE.isPinching) {
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, size + 15, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ============================================
        // GAME FLOW
        // ============================================
        function nextQuestion() {
            STATE.questionIndex++;

            if (STATE.questionIndex >= 10) {
                endRound();
                return;
            }

            STATE.currentQuestion = generateQuestion();
            spawnTargets();
        }

        function endRound() {
            STATE.isRunning = false;
            document.getElementById('shootBtn').classList.add('hidden');
            showRanking();
        }

        function showRanking() {
            const display = document.getElementById('rankingDisplay');
            display.innerHTML = `
                <div class="ranking-entry rank-1">
                    <span>🎉 Your Score</span>
                    <span>${STATE.score} pts</span>
                </div>
                <div class="ranking-entry">
                    <span>🔥 Best Streak</span>
                    <span>${STATE.bestStreak}</span>
                </div>
                <div class="ranking-entry">
                    <span>📊 Accuracy</span>
                    <span>${STATE.questionIndex > 0 ? Math.round(STATE.score / STATE.questionIndex) : 0} pts/q</span>
                </div>
            `;
            document.getElementById('rankingOverlay').classList.remove('hidden');
        }

        function nextRound() {
            document.getElementById('rankingOverlay').classList.add('hidden');
            STATE.level++;
            startGame();
        }

        // ============================================
        // AUDIO
        // ============================================
        function initAudio() {
            try {
                STATE.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {}
        }

        function playSound(type) {
            if (!STATE.audioCtx) return;
            try {
                const osc = STATE.audioCtx.createOscillator();
                const gain = STATE.audioCtx.createGain();
                osc.connect(gain);
                gain.connect(STATE.audioCtx.destination);
                const now = STATE.audioCtx.currentTime;

                switch (type) {
                    case 'shoot':
                        osc.frequency.value = 220;
                        osc.type = 'square';
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                        break;
                    case 'correct':
                        osc.frequency.value = 523;
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                        break;
                    case 'wrong':
                        osc.frequency.value = 150;
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'miss':
                        osc.frequency.value = 100;
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                }
            } catch (e) {}
        }

        function showFeedback(text, color) {
            const existing = document.querySelector('.feedback');
            if (existing) existing.remove();

            const el = document.createElement('div');
            el.className = 'feedback';
            el.textContent = text;
            el.style.color = color;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // ============================================
        // MAIN LOOP
        // ============================================
        function gameLoop() {
            if (!STATE.isRunning) return;

            const elapsed = (performance.now() - STATE.gameStartTime) / 1000;
            STATE.timeLeft = Math.max(0, 60 - elapsed);

            if (STATE.timeLeft <= 0) {
                endRound();
                return;
            }

            updateCursor();
            updateTargets();
            updateParticles();
            render();

            requestAnimationFrame(gameLoop);
        }

        async function detectionLoop() {
            if (!STATE.isRunning || !STATE.modelReady) return;

            try {
                await STATE.hands.send({ image: STATE.video });
            } catch (e) {}

            if (STATE.isRunning) {
                setTimeout(detectionLoop, 33);
            }
        }

        // ============================================
        // START
        // ============================================
        async function startGame() {
            STATE.score = 0;
            STATE.streak = 0;
            STATE.bestStreak = 0;
            STATE.questionIndex = 0;
            STATE.timeLeft = 60;
            STATE.targets = [];
            STATE.particles = [];
            STATE.cursorX = STATE.width / 2;
            STATE.cursorY = STATE.height / 2;

            STATE.currentQuestion = generateQuestion();
            spawnTargets();

            STATE.isRunning = true;
            STATE.gameStartTime = performance.now();

            // Show shoot button
            document.getElementById('shootBtn').classList.remove('hidden');

            requestAnimationFrame(gameLoop);
            detectionLoop();
        }

        async function startGameFromButton() {
            try {
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('loadingOverlay').classList.remove('hidden');

                initCanvas();
                initAudio();
                await initMediaPipe();

                document.getElementById('loadingOverlay').classList.add('hidden');
                await startGame();

            } catch (e) {
                console.error(e);
                document.getElementById('errorMessage').textContent = e.message;
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('errorOverlay').classList.remove('hidden');
            }
        }

        // Shoot button event
        document.getElementById('shootBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            tryShoot();
        });
        document.getElementById('shootBtn').addEventListener('click', (e) => {
            e.preventDefault();
            tryShoot();
        });

        // Prevent scroll
        document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
